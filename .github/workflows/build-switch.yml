# Switch (Nintendo Switch NRO) build — isolated from the upstream build.yml on purpose:
# our fork tracks TwilitRealm/dusklight and this file is fork-local, so upstream CI changes
# never conflict with it.
#
# STATUS (bring-up): the two external Switch artifacts are now sourced as follows:
#   1. dawn-switch — PUBLIC at danfromtico/dawn-switch (branch `switch`; HayatoG's fork of it is
#      private). Shallow-cloned into platforms/switch/reference/dawn-switch (gitignored) below,
#      matching the layout build-docker.sh and AURORA_DAWN_SOURCE_DIR expect.
#   2. nvk-switch — Mesa NVK package (libvulkan.a + headers). No public release of the packaged
#      artifact exists; it is produced by the switch-nvk repo (github.com/HayatoG/switch-nvk,
#      public) via a 60-90 min Mesa cross-build (Dockerfile + package-nvk.sh). Until a packaged
#      artifact is published or we add a dedicated CI job for it, provide it via the
#      DAWN_SWITCH_NVK_ROOT path (aurora-switch defaults to /opt/nvk-switch).

name: Build Switch (NRO)

on:
  push:
    paths-ignore:
      - '*.md'
      - '*LICENSE'
  workflow_dispatch:

concurrency:
  group: build-switch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-switch:
    name: Build Switch (devkitA64)
    runs-on: ubuntu-24.04
    container:
      image: devkitpro/devkita64:latest
    steps:
      - name: Install git + ninja
        run: |
          apt-get update
          apt-get -y install git ninja-build ca-certificates

      # devkitPro ships NO Vulkan for Switch (switch-mesa is OpenGL-only; their answer is
      # deko3d), and Mesa upstream has no libvulkan.a target. Building NVK from source means
      # cross-compiling Mesa 25 + a Rust sysroot for a tier-3 target: 1-3h and a moving
      # nightly toolchain. jhuz0/nvk-switch publishes a reproducible prebuilt archive
      # (NVK + support archives + expat + newlib gap fills + loaderless glue, built from the
      # public PalindromicBreadLoaf/nxvk), laid out exactly as aurora-core expects:
      #   <root>/lib/libvulkan.a  and  <root>/include/vulkan/*.h
      - name: Install prebuilt NVK (Mesa 25.0.7)
        run: |
          mkdir -p /opt/nvk-switch
          curl -sL -o nvk.tar.xz \
            "https://github.com/jhuz0/nvk-switch/releases/download/nvk-switch-mesa-25.0.7-r1/nvk-switch-25.0.7.tar.xz"
          tar -xJf nvk.tar.xz -C /opt/nvk-switch
          rm -f nvk.tar.xz
          test -f /opt/nvk-switch/lib/libvulkan.a \
            || { echo "FATAL: /opt/nvk-switch/lib/libvulkan.a missing"; exit 1; }
          ls -la /opt/nvk-switch/lib

      # aurora-core links libdrm_nouveau + zstd on Switch. These normally come from
      # devkitPro's portlibs, but pkg.devkitpro.org answers pacman with 403 from CI
      # egress IPs (Cloudflare), so treat pacman as best-effort and fall back to
      # source builds (both are small and build with the devkitA64 toolchain in the
      # image). None of this is needed to *configure*: a missing portlib only shows
      # up at link time, so the step must not abort the job.
      - name: Switch portlibs (libdrm_nouveau, zstd)
        continue-on-error: true
        run: |
          export DEVKITPRO=/opt/devkitpro
          PKGMGR="$(command -v dkp-pacman || command -v pacman)"
          "$PKGMGR" -Sy || "$PKGMGR" -Sy || echo "WARN: cannot sync dkp databases (403 from Cloudflare is common)"
          "$PKGMGR" -Ss drm_nouveau || true
          "$PKGMGR" -S --noconfirm --needed switch-libdrm_nouveau switch-zstd switch-zlib \
            || echo "WARN: pacman install failed - building from source"

          have() { find /opt/devkitpro -name "$1" -print -quit 2>/dev/null; }

          if [ -z "$(have libdrm_nouveau.a)" ]; then
            echo "== libdrm_nouveau: building from source =="
            git clone --depth 1 https://github.com/devkitPro/libdrm_nouveau.git /tmp/libdrm_nouveau
            make -C /tmp/libdrm_nouveau -j4 && make -C /tmp/libdrm_nouveau install
          fi

          if [ -z "$(have libzstd.a)" ]; then
            echo "== zstd: building from source =="
            git clone --depth 1 -b v1.5.6 https://github.com/facebook/zstd.git /tmp/zstd
            make -C /tmp/zstd/lib -j4 libzstd.a \
              CC=$DEVKITPRO/devkitA64/bin/aarch64-none-elf-gcc \
              AR=$DEVKITPRO/devkitA64/bin/aarch64-none-elf-ar
            mkdir -p $DEVKITPRO/portlibs/switch/lib
            cp /tmp/zstd/lib/libzstd.a $DEVKITPRO/portlibs/switch/lib/
          fi

          # dusk's GAME_LIBS links ZLIB::ZLIB; nothing on the Switch side provides it, and
          # devkitPro only ships it as a portlib (pacman is best-effort here), so fall back to
          # a static build with the devkitA64 toolchain. zlib's configure is plain shell and
          # cross-compiles fine with CC/AR/RANLIB overridden.
          if [ -z "$(have libz.a)" ]; then
            echo "== zlib: building from source =="
            rm -rf /tmp/zlib-src
            git clone --depth 1 -b v1.3.1 https://github.com/madler/zlib.git /tmp/zlib-src
            ( cd /tmp/zlib-src
              CC=$DEVKITPRO/devkitA64/bin/aarch64-none-elf-gcc \
              AR=$DEVKITPRO/devkitA64/bin/aarch64-none-elf-ar \
              RANLIB=$DEVKITPRO/devkitA64/bin/aarch64-none-elf-ranlib \
              ./configure --static --prefix=$DEVKITPRO/portlibs/switch
              make -j4 libz.a
              mkdir -p $DEVKITPRO/portlibs/switch/lib $DEVKITPRO/portlibs/switch/include
              cp libz.a $DEVKITPRO/portlibs/switch/lib/
              cp zlib.h zconf.h $DEVKITPRO/portlibs/switch/include/ )
          fi

          echo "== portlib status =="
          echo "libdrm_nouveau.a -> $(have libdrm_nouveau.a || echo MISSING)"
          echo "libzstd.a        -> $(have libzstd.a || echo MISSING)"
          echo "libz.a           -> $(have libz.a || echo MISSING)"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      # dawn-switch is public (danfromtico/dawn-switch, branch `switch`). Shallow clone (~200 MB)
      # into the layout build-docker.sh / AURORA_DAWN_SOURCE_DIR expect. Cached because Dawn is big.
      - name: Fetch dawn-switch (public fork)
        uses: actions/cache@v4
        with:
          path: platforms/switch/reference/dawn-switch
          key: dawn-switch-switch-v2-${{ vars.DAWN_SWITCH_REV || 'pinned' }}
      - name: Clone dawn-switch
        run: |
          # Dawn's build deps live in git submodules. A blanket
          # `submodule update --init --recursive` is NOT usable here:
          #   * third_party/angle nests gles1_conform, which points at the private
          #     chrome-internal.googlesource.com — the clone prompts for credentials and
          #     aborts the whole recursion ("Failed to recurse into submodule path
          #     third_party/angle"), leaving later deps like spirv-tools un-fetched.
          #   * angle/swiftshader/mesa are huge and unused for our config (Vulkan only,
          #     DAWN_ENABLE_OPENGLES=OFF, no tests, no benchmarks).
          # So: init exactly the deps Dawn's third_party/CMakeLists.txt consumes for this
          # configuration, then recurse only inside those that carry their own submodules.
          git config --global --add safe.directory '*'
          DS=platforms/switch/reference/dawn-switch
          SUBS="third_party/abseil-cpp third_party/spirv-headers/src third_party/spirv-tools/src third_party/vulkan-headers/src third_party/vulkan-utility-libraries/src third_party/glslang/src"
          need_clone=1
          if [ -d "$DS/.git" ]; then
            need_clone=0
            for d in $SUBS; do [ -f "$DS/$d/CMakeLists.txt" ] || need_clone=1; done
          fi
          if [ "$need_clone" = 1 ]; then
            rm -rf "$DS"
            mkdir -p platforms/switch/reference
            git clone --depth 1 --branch switch --jobs 4 \
              https://github.com/danfromtico/dawn-switch.git "$DS"
            # --depth 1 is not used for submodules: their gitlinks pin commits that are not
            # branch tips, so a shallow fetch fails with "Unable to fetch ... <sha>".
            git -C "$DS" submodule init $SUBS
            git -C "$DS" submodule update --jobs 8 $SUBS
            # SPIRV-Tools / Vulkan-Utility-Libraries carry their own external deps.
            # emdawnwebgpu's code generator needs these two vendored python deps. They are
          # plain gitlinks with no CMakeLists.txt, so they must NOT go into $SUBS (whose
          # entries are validated by looking for one). Run unconditionally so a
          # cache-restored Dawn tree gets them too.
          git -C "$DS" submodule update --init --jobs 8 \
            third_party/jinja2 third_party/markupsafe \
            || echo "WARN: could not fetch vendored jinja2/markupsafe"
          for d in $SUBS; do
              if [ -f "$DS/$d/.gitmodules" ]; then
                git -C "$DS/$d" submodule update --init --recursive --jobs 8 || true
              fi
            done
          fi
          for d in $SUBS; do
            [ -f "$DS/$d/CMakeLists.txt" ] || { echo "FATAL: $DS/$d missing after clone"; exit 1; }
          done
          git -C "$DS" log --oneline -1

      # Dawn vendors abseil, which assumes a POSIX host in two places. devkitA64's newlib
      # breaks both:
      #   * absl/base/internal/sysinfo.cc - GetTID() falls back to
      #     static_cast<pid_t>(pthread_self()), but newlib's pthread_t is an opaque
      #     `struct __pthread_t *` (sys/_pthreadtypes.h), so the static_cast is invalid.
      #     Cast the pointer value instead: it is still unique per thread, which is all
      #     GetCachedTID() needs.
      #   * absl/base/internal/thread_identity.cc - SetCurrentThreadIdentity() masks all
      #     signals around pthread_setspecific() via sigfillset/pthread_sigmask/SIG_SETMASK.
      #     Horizon has no POSIX signals, so take the same branch abseil already uses for
      #     Emscripten/WASI/MinGW (plain pthread_setspecific, no signal handling).
      - name: Patch abseil for Horizon (newlib)
        run: |
          AB=platforms/switch/reference/dawn-switch/third_party/abseil-cpp
          test -f "$AB/absl/base/internal/sysinfo.cc" || { echo "FATAL: abseil not cloned"; exit 1; }
          sed -i 's/return static_cast<pid_t>(pthread_self());/return static_cast<pid_t>(reinterpret_cast<unsigned long>(pthread_self()));/' \
            "$AB/absl/base/internal/sysinfo.cc"
          if ! grep -q '__SWITCH__' "$AB/absl/base/internal/thread_identity.cc"; then
            sed -i 's/defined(__hexagon__)/defined(__hexagon__) || defined(__SWITCH__)/' \
              "$AB/absl/base/internal/thread_identity.cc"
          fi
          #   * absl/debugging/internal/elf_mem_image.h - devkitA64 targets ELF, so abseil
          #     defines ABSL_HAVE_ELF_MEM_IMAGE and pulls in glibc's <link.h> (ElfW/dl_iterate
          #     phdr symbolization). newlib has no <link.h>; opt out the same way the header
          #     already excludes OpenBSD/QNX/wasm/Haiku/VxWorks/hexagon/Xtensa.
          if ! grep -q '__SWITCH__' "$AB/absl/debugging/internal/elf_mem_image.h"; then
            sed -i 's/!defined(__XTENSA__)/!defined(__XTENSA__) \&\& !defined(__SWITCH__)/' \
              "$AB/absl/debugging/internal/elf_mem_image.h"
          fi
          grep -n 'reinterpret_cast<unsigned long>' "$AB/absl/base/internal/sysinfo.cc"
          grep -n '__SWITCH__' "$AB/absl/base/internal/thread_identity.cc"
          grep -n '__SWITCH__' "$AB/absl/debugging/internal/elf_mem_image.h"
          #   * absl/time/internal/cctz/src/time_zone_libc.cc - the generic fallback declares
          #     `template<class T> auto tm_gmtoff(const T&) -> decltype(tm.tm_gmtoff)` (and the
          #     __tm_gmtoff spelling). newlib's struct tm has neither field, so deduction fails:
          #     "no matching function for call to 'tm_gmtoff(std::tm{})'". Add a non-template
          #     exact-match overload, which wins overload resolution and keeps the templates
          #     uninstantiated. Done in Python because the anchor is a two-line template.
          python3 - "$AB/absl/time/internal/cctz/src/time_zone_libc.cc" <<'PYEOF'
import io, sys
path = sys.argv[1]
src = io.open(path, encoding="utf-8").read()
if "__SWITCH__" in src:
    print("cctz: already patched")
    sys.exit(0)
anchor = "auto tm_gmtoff(const T& tm) -> decltype(tm.tm_gmtoff) {"
if anchor not in src:
    print("WARN: cctz anchor not found, leaving file untouched")
    sys.exit(0)
shim = (
    "#if defined(__SWITCH__)\n"
    "// newlib's struct tm carries no tm_gmtoff/__tm_gmtoff extension fields, so the\n"
    "// generic fallback templates below cannot be instantiated for it at all. A\n"
    "// non-template exact-match overload wins overload resolution and leaves them\n"
    "// uninstantiated. Horizon has no zone database, so UTC offset 0 / no zone name.\n"
    "inline long tm_gmtoff(const std::tm&) { return 0; }\n"
    "inline const char* tm_zone(const std::tm&) { return \"\"; }\n"
    "#endif\n"
)
io.open(path, "w", encoding="utf-8").write(src.replace(anchor, shim + anchor, 1))
print("cctz: patched")
PYEOF

      - name: Configure (Switch toolchain)
        run: |
          cmake -S . -B build-switch -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$DEVKITPRO/cmake/Switch.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DDUSK_MOVIE_SUPPORT=OFF \
            -DDUSK_ENABLE_UPDATE_CHECKER=OFF \
            -DDUSK_ENABLE_DISCORD=OFF \
            -DAURORA_PLATFORM_SWITCH=ON \
            -DDAWN_SWITCH_NVK_ROOT=/opt/nvk-switch \
            -DAURORA_ENABLE_RMLUI=ON \
            -DAURORA_ENABLE_IMGUI=OFF \
            -DAURORA_DAWN_PROVIDER=source \
            -DAURORA_DAWN_SOURCE_DIR=$PWD/platforms/switch/reference/dawn-switch \
            -DDAWN_FETCH_DEPENDENCIES=ON \
            -DAURORA_BACKEND_DEKO3D=OFF \
            -DAURORA_BACKEND_GLES=OFF \
            -DAURORA_BACKEND_DAWN_GL=OFF \
            -DDAWN_PLATFORM_SWITCH=ON \
            -DDAWN_ENABLE_VULKAN=ON \
            -DDAWN_ENABLE_OPENGLES=OFF \
            -DDAWN_ENABLE_DESKTOP_GL=OFF \
            -DTINT_BUILD_GLSL_WRITER=OFF \
            -DTINT_BUILD_SPV_WRITER=ON \
            -DTINT_BUILD_IR_BINARY=OFF \
            -DDAWN_BUILD_PROTOBUF=OFF

      - name: Build
        run: cmake --build build-switch -j"$(nproc)"

      - name: Package NRO
        if: success()
        run: |
          bash platforms/switch/make-nro.sh || true
          find . -name "*.nro" -o -name "*.elf" | head

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: dusklight-switch-nro
          path: |
            **/*.nro
